            </span>

    <!-- ==========================================

        <li>

            <a class="subheader">
                RappiEmma

        </li>

                Inicio

                href="pages/about.html"

            <div class="divider"></div>

        </li>

        <li>

                </i>

                Contacto

        </li>

    <!-- ==========================================
         LISTA DE PLATILLOS
         ========================================== -->

    <main>

        <div class="recipes container grey-text text-darken-1">

            <!-- Los platillos aparecerán aquí -->

        </div>


        <!-- ======================================
             REGISTRAR PEDIDO
             ====================================== -->

        <div class="container pedido-panel">

            <div class="card-panel">

                <h5 class="center">
                    Registrar pedido
                </h5>


                <div
                    id="pedidoSeleccionado"
                    class="pedido-seleccionado">

                    <p class="center grey-text">

                        Selecciona un platillo para comenzar.

                    </p>

                </div>


                <!-- Nombre del pedido -->

                <div class="input-field">

                    <input
                        id="pedidoNombre"
                        type="text"
                        placeholder="Nombre del pedido">

                    <label for="pedidoNombre">
                        Pedido
                    </label>

                </div>


                <!-- ==================================
                     UBICACIÓN
                     ================================== -->

                <div class="center">

                    <button
                        id="btnUbicacion"
                        type="button"
                        class="btn">

                        <i class="material-icons left">
                            location_on
                        </i>

                        Obtener ubicación

                    </button>

                </div>


                <p
                    id="ubicacionTexto"
                    class="center grey-text">

                    Ubicación no registrada

                </p>


                <!-- ==================================
                     MAPA
                     ================================== -->

                <div class="mapa-container">

                    <div id="mapa"></div>

                </div>


                <!-- ==================================
                     FOTOGRAFÍA
                     ================================== -->

                <div class="foto-container center">

                    <label
                        for="fotoPedido"
                        class="btn">

                        <i class="material-icons left">
                            photo_camera
                        </i>

                        Tomar fotografía

                    </label>

                    <input
                        id="fotoPedido"
                        type="file"
                        accept="image/*"
                        capture="environment">


                    <img
                        id="previewFoto"
                        class="preview-foto"
                        alt="Vista previa de la fotografía">

                </div>


                <!-- ==================================
                     GUARDAR
                     ================================== -->

                <div class="center">

                    <button
                        id="btnGuardarPedido"
                        type="button"
                        class="btn-large">

                        <i class="material-icons left">
                            save
                        </i>

                        Guardar pedido

                    </button>

                </div>


                <p
                    id="estadoPedido"
                    class="center estado-pedido">
                </p>

            </div>

        </div>

    </main>


    <!-- ==========================================
         BOTÓN AGREGAR
         ========================================== -->

    <div class="center">

        <a
            class="btn-floating btn-large add-btn sidenav-trigger"
            data-target="side-form">

            <i class="material-icons">
                add
            </i>

        </a>

    </div>


    <!-- ==========================================
         FORMULARIO AGREGAR PLATILLO
         ========================================== -->

    <div
        id="side-form"
        class="sidenav side-form">

        <form
            class="add-recipe container section">

            <h6>
                Nuevo platillo
            </h6>

            <div class="divider"></div>


            <div class="input-field">

                <input
                    placeholder="Ejemplo: Pizza"
                    id="title"
                    type="text"
                    class="validate">

                <label for="title">
                    Nombre
                </label>

            </div>


            <div class="input-field">

                <input
                    placeholder="Ejemplo: queso, tomate, pepperoni"
                    id="ingredients"
                    type="text"
                    class="validate">

                <label for="ingredients">
                    Ingredientes
                </label>

            </div>


            <div class="input-field center">

                <button
                    id="btnAgregarPlatillo"
                    type="submit"
                    class="btn-small">

                    Agregar

                </button>

            </div>

        </form>

    </div>

</body>
